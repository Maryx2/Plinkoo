<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLINKO! By High Notes — Player</title><link rel="stylesheet" href="/styles.css"><script src="/plinko-physics.js"></script></head>
<body>
<div class="shell">
  <header class="top">
    <div><div class="brand-kicker">HIGH NOTES PRESENTS · PLAYER</div><h1><b>PLINKO!</b> <span style="font-size:.42em;color:var(--muted)">By High Notes</span></h1></div>
    <div class="stats"><a href="/" class="pill" style="text-decoration:none">← Home</a><div class="pill">Room <b id="roomTop">—</b></div></div>
  </header>

  <section id="joinView" class="card" style="max-width:520px;margin:20px auto 0">
    <div class="label">Join a Show</div>
    <input id="roomCode" maxlength="6" placeholder="Room code">
    <input id="playerName" maxlength="24" placeholder="Your name" style="margin-top:8px">
    <button id="join" class="primary" style="width:100%;margin-top:8px">Join PLINKO!</button>
    <div id="joinMsg" class="muted status"></div>
  </section>

  <section id="gameView" class="hidden">
    <div class="grid">
      <div class="card boardCard">
        <canvas id="c" width="760" height="820"></canvas>
        <div id="toast" class="toast"></div>
      </div>
      <aside class="side">
        <div class="card">
          <div class="label">Contestant</div><div class="big" id="who">—</div>
          <div class="label" style="margin-top:12px">Available Balls</div><div class="big"><span id="balls">0</span> balls</div>
          <div class="label" style="margin-top:12px">Session Winnings</div><div class="money" id="cash">$0</div>
          <div class="label" style="margin-top:12px">Total Winnings</div><div class="big" id="totalCash">$0</div>
        </div>
        <div class="card">
          <button id="dropBtn" class="primary" style="width:100%;font-size:18px">DROP BALL</button>
          <div id="playMsg" class="muted status">Click anywhere on the board to choose your drop point.</div>
        </div>

        <div class="card">
          <div class="label">Live Leaderboard</div>
          <table>
            <thead><tr><th>#</th><th>Player</th><th>Session</th><th>Total</th><th>Balls</th></tr></thead>
            <tbody id="playerLeaderBody"></tbody>
          </table>
          <div class="muted status" id="leaderStatus">Updates automatically.</div>
        </div>
      </aside>
    </div>
  </section>
</div>
<script>
let session={code:localStorage.getItem("plinko_player_code")||"",token:localStorage.getItem("plinko_player_token")||""};
let state=null,busy=false;
const $=id=>document.getElementById(id);
function safeNum(v,fallback=0){const n=Number(v);return Number.isFinite(n)?n:fallback}
function money(n){return "$"+safeNum(n,0).toLocaleString(undefined,{maximumFractionDigits:2})}
async function post(url,body){const r=await fetch(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}
function setMsg(text,good=false){$("playMsg").textContent=text;$("playMsg").className="muted status "+(good?"good":"bad")}

$("join").onclick=async()=>{
  try{
    const j=await post("/api/player-join",{code:$("roomCode").value,name:$("playerName").value});
    session={code:j.code,token:j.playerToken};localStorage.setItem("plinko_player_code",session.code);localStorage.setItem("plinko_player_token",session.token);
    openGame();await refresh();
  }catch(e){$("joinMsg").textContent=e.message;$("joinMsg").className="muted status bad"}
};
function openGame(){$("joinView").classList.add("hidden");$("gameView").classList.remove("hidden");$("roomTop").textContent=session.code}
async function refresh(){
  if(!session.token)return;
  try{
    state=await post("/api/player-state",{code:session.code,playerToken:session.token});
    if($("who")) $("who").textContent=state.player.name;
    if($("balls")) $("balls").textContent=state.player.balls;
    if($("cash")) $("cash").textContent=money(state.player.cash);
    if($("ballValueDisplay")) $("ballValueDisplay").textContent=money(safeNum(state?.show?.ball_value,0));
  }catch(e){setMsg(e.message)}
}

const c=$("c"),ctx=c.getContext("2d");
const PC=HighNotesPlinkoPhysics.CONFIG;
const W=PC.W,H=PC.H,slotW=PC.slotW,slots=PC.slots;
const dropMinX=PC.dropMinX,dropMaxX=PC.dropMaxX;
let balls=[],dropX=W/2;

async function startDrop(x=dropX){
  if(busy)return;
  if(!state){setMsg("Join the show first.");return}
  if(state.player.balls<=0){setMsg("You have no balls left.");return}
  busy=true;
  try{
    const normalizedStart=Math.max(0,Math.min(1,(x-dropMinX)/(dropMaxX-dropMinX)));
    const j=await post("/api/player-drop",{code:session.code,playerToken:session.token,startX:normalizedStart});
    state.player=j.player;$("balls").textContent=state.player.balls;
    const b=HighNotesPlinkoPhysics.makeBall({
      id:j.dropId,
      startX:j.startX,
      seed:j.physicsSeed,
      startedAt:j.startedAt,
      player:state.player.name
    });
    b.framesSimulated=0;
    balls.push(b);
    setMsg("Ball dropped — good luck!",true)
  }catch(e){setMsg(e.message)}
  finally{busy=false}
}
async function settle(b){
  if(!b.active)return;b.active=false;
  const slot=Math.max(0,Math.min(slots-1,Math.floor(b.x/slotW)));
  try{
    const j=await post("/api/player-settle",{code:session.code,playerToken:session.token,dropId:b.id,slot});
    state.player=j.player;$("cash").textContent=money(state.player.cash);$("balls").textContent=state.player.balls;show("+"+money(j.prize));
  }catch(e){setMsg(e.message)}
  setTimeout(()=>{const i=balls.indexOf(b);if(i>=0)balls.splice(i,1)},900)
}
function show(t){const e=$("toast");e.textContent=t;e.style.color="#ffd84a";e.classList.remove("show");void e.offsetWidth;e.classList.add("show")}

const submittedDrops=new Set();

async function checkSettledBalls(){
  for(const b of balls){
    if(b.finished && !submittedDrops.has(b.id)){
      submittedDrops.add(b.id);
      try{
        const j=await post("/api/player-settle",{
          code:session.code,
          playerToken:session.token,
          dropId:b.id,
          slot:b.slot
        });
        state.player=j.player;
        if(j.multiplier===undefined || j.multiplier===null || !Number.isFinite(Number(j.multiplier))){
          j.multiplier=safeNum(state?.show?.prizes?.[b.slot],0);
        }
        if($("cash")) $("cash").textContent=money(state.player.cash);
        if($("balls")) $("balls").textContent=state.player.balls;
        // Prefer the server-returned multiplier. If an older database function
        // does not return it yet, use the actual multiplier from the slot the
        // ball physically landed in instead of displaying 0×.
        const slotMultiplier=safeNum(state?.show?.prizes?.[b.slot],0);
        const mult=safeNum(j.multiplier,slotMultiplier);
        const shownMult=Number.isInteger(mult)?mult:Math.round(mult*100)/100;
        show(`${shownMult}×  +${money(j.prize)}`);
      }catch(e){
        submittedDrops.delete(b.id);
        setMsg(e.message);
      }
      setTimeout(()=>{
        balls=balls.filter(x=>x.id!==b.id);
      },2500);
    }
  }
}

function loop(){
  for(const b of balls){
    if(b.active)HighNotesPlinkoPhysics.advanceRealTime(b);
  }
  const boardMultipliers=Array.isArray(state?.show?.prizes)
    ? state.show.prizes.map(v=>safeNum(v,0))
    : [0.2,0.5,1,2,5,10,5,2,1,0.5,0.2];
  HighNotesPlinkoPhysics.drawBoard(ctx,balls,boardMultipliers);
  checkSettledBalls();
  requestAnimationFrame(loop);
}
loop();

function pt(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
c.addEventListener("pointermove",e=>dropX=Math.max(dropMinX,Math.min(dropMaxX,pt(e).x)));
c.addEventListener("pointerdown",e=>{dropX=Math.max(dropMinX,Math.min(dropMaxX,pt(e).x));startDrop(dropX)});
$("dropBtn").onclick=()=>startDrop(dropX);


function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function refreshLeaderboard(){
  if(!session.code)return;
  try{
    const j=await post("/api/live-state",{code:session.code});
    const body=$("playerLeaderBody");
    if(!body) return;
    body.innerHTML=(j.players||[])
      .slice()
      .sort((a,b)=>Number(b.total_cash)-Number(a.total_cash) || Number(b.session_cash)-Number(a.session_cash))
      .map((p,i)=>
        `<tr>
          <td>${i+1}</td>
          <td>${esc(p.name)}</td>
          <td>${money(p.session_cash)}</td>
          <td><b>${money(p.total_cash)}</b></td>
          <td>${p.balls}</td>
        </tr>`
      ).join("");
    const me=(j.players||[]).find(p=>String(p.id)===String(state?.player?.id));
    if(me){
      if($("totalCash")) $("totalCash").textContent=money(me.total_cash);
      if($("cash")) $("cash").textContent=money(me.session_cash);
    }
    if($("leaderStatus")) $("leaderStatus").textContent="Live · updated just now";
  }catch(e){
    if($("leaderStatus")) $("leaderStatus").textContent="Leaderboard reconnecting…";
  }
}

if(session.code&&session.token){openGame();refresh();refreshLeaderboard()}
setInterval(()=>{if(!document.hidden&&session.token)refresh()},2500);
setInterval(()=>{if(!document.hidden&&session.code)refreshLeaderboard()},1000);
</script>
</body></html>
