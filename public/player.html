<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLINKO! By High Notes — Player</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<div class="shell">
  <header class="top">
    <div><div class="brand-kicker">HIGH NOTES PRESENTS · PLAYER</div><h1><b>PLINKO!</b> <span style="font-size:.42em;color:var(--muted)">By High Notes</span></h1></div>
    <div class="stats"><a href="/" class="pill" style="text-decoration:none">← Home</a><div class="pill">Room <b id="roomTop">—</b></div></div>
  </header>

  <section id="joinView" class="card" style="max-width:520px;margin:20px auto 0">
    <div class="label">Join a Show</div>
    <input id="roomCode" maxlength="6" placeholder="Room code">
    <input id="playerName" maxlength="24" placeholder="Your name" style="margin-top:8px">
    <button id="join" class="primary" style="width:100%;margin-top:8px">Join PLINKO!</button>
    <div id="joinMsg" class="muted status"></div>
  </section>

  <section id="gameView" class="hidden">
    <div class="grid">
      <div class="card boardCard">
        <canvas id="c" width="760" height="820"></canvas>
        <div id="toast" class="toast"></div>
      </div>
      <aside class="side">
        <div class="card">
          <div class="label">Contestant</div><div class="big" id="who">—</div>
          <div class="label" style="margin-top:12px">Available Balls</div><div class="big"><span id="balls">0</span> balls</div>
          <div class="label" style="margin-top:12px">Money Won</div><div class="money" id="cash">$0</div>
        </div>
        <div class="card">
          <button id="dropBtn" class="primary" style="width:100%;font-size:18px">DROP BALL</button>
          <div id="playMsg" class="muted status">Click anywhere on the board to choose your drop point.</div>
        </div>
      </aside>
    </div>
  </section>
</div>
<script>
let session={code:localStorage.getItem("plinko_player_code")||"",token:localStorage.getItem("plinko_player_token")||""};
let state=null,busy=false;
const $=id=>document.getElementById(id);
function money(n){return "$"+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}
async function post(url,body){const r=await fetch(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}
function setMsg(text,good=false){$("playMsg").textContent=text;$("playMsg").className="muted status "+(good?"good":"bad")}

$("join").onclick=async()=>{
  try{
    const j=await post("/api/player-join",{code:$("roomCode").value,name:$("playerName").value});
    session={code:j.code,token:j.playerToken};localStorage.setItem("plinko_player_code",session.code);localStorage.setItem("plinko_player_token",session.token);
    openGame();await refresh();
  }catch(e){$("joinMsg").textContent=e.message;$("joinMsg").className="muted status bad"}
};
function openGame(){$("joinView").classList.add("hidden");$("gameView").classList.remove("hidden");$("roomTop").textContent=session.code}
async function refresh(){
  if(!session.token)return;
  try{
    state=await post("/api/player-state",{code:session.code,playerToken:session.token});
    $("who").textContent=state.player.name;$("balls").textContent=state.player.balls;$("cash").textContent=money(state.player.cash);
  }catch(e){setMsg(e.message)}
}

const c=$("c"),ctx=c.getContext("2d"),W=c.width,H=c.height;
const rows=12,pegR=6,ballR=11,topY=135,rowGap=43,slotTop=702,slots=11,slotW=W/slots;
const pegWallMargin=24,pegGap=(W-(pegWallMargin*2))/12,dropMinX=pegWallMargin+ballR+4,dropMaxX=W-dropMinX;
let pegs=[],balls=[],dropX=W/2;
function build(){
  for(let r=0;r<rows;r++){const y=topY+r*rowGap;
    if(r%2===0){for(let i=0;i<=12;i++)pegs.push({x:pegWallMargin+i*pegGap,y})}
    else{for(let i=0;i<12;i++)pegs.push({x:pegWallMargin+pegGap/2+i*pegGap,y});pegs.push({x:pegWallMargin,y},{x:W-pegWallMargin,y})}
  }
} build();

async function startDrop(x=dropX){
  if(busy)return;
  if(!state){setMsg("Join the show first.");return}
  if(state.player.balls<=0){setMsg("You have no balls left.");return}
  busy=true;
  try{
    const j=await post("/api/player-drop",{code:session.code,playerToken:session.token});
    state.player=j.player;$("balls").textContent=state.player.balls;
    balls.push({id:j.dropId,x:Math.max(dropMinX,Math.min(dropMaxX,x)),y:55,vx:(Math.random()-.5)*.7,vy:.15,active:true,settleFrames:0});
    setMsg("Ball dropped — good luck!",true)
  }catch(e){setMsg(e.message)}
  finally{busy=false}
}
async function settle(b){
  if(!b.active)return;b.active=false;
  const slot=Math.max(0,Math.min(slots-1,Math.floor(b.x/slotW)));
  try{
    const j=await post("/api/player-settle",{code:session.code,playerToken:session.token,dropId:b.id,slot});
    state.player=j.player;$("cash").textContent=money(state.player.cash);$("balls").textContent=state.player.balls;show("+"+money(j.prize));
  }catch(e){setMsg(e.message)}
  setTimeout(()=>{const i=balls.indexOf(b);if(i>=0)balls.splice(i,1)},900)
}
function show(t){const e=$("toast");e.textContent=t;e.style.color="#ffd84a";e.classList.remove("show");void e.offsetWidth;e.classList.add("show")}
function collide(b,cx,cy,r,bounce=.62){
  const dx=b.x-cx,dy=b.y-cy,min=ballR+r,d2=dx*dx+dy*dy;if(d2>=min*min||d2<.0001)return false;
  const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,o=min-d;b.x+=nx*o;b.y+=ny*o;
  const rel=b.vx*nx+b.vy*ny;if(rel<0){b.vx-=(1+bounce)*rel*nx;b.vy-=(1+bounce)*rel*ny}return true
}
function physics(){
  for(const b of balls){if(!b.active)continue;b.vy+=.285;b.vx*=.9985;b.x+=b.vx;b.y+=b.vy;
    const left=pegWallMargin-8,right=W-pegWallMargin+8;
    if(b.x-ballR<left){b.x=left+ballR;b.vx=Math.abs(b.vx)*.68}
    if(b.x+ballR>right){b.x=right-ballR;b.vx=-Math.abs(b.vx)*.68}
    for(const p of pegs)if(collide(b,p.x,p.y,pegR,.58))b.vx+=(Math.random()-.5)*.16;
    if(b.y>slotTop-42){for(let i=1;i<slots;i++){const x=i*slotW;collide(b,x,slotTop+2,6,.72);
      if(b.y+ballR>slotTop+4&&b.y-ballR<H-25){const dx=b.x-x;if(Math.abs(dx)<ballR+2){b.x=x+(dx<0?-(ballR+2):(ballR+2));b.vx=(dx<0?-1:1)*Math.max(.35,Math.abs(b.vx)*.62);if(b.vy>1.2&&b.y<slotTop+32)b.vy*=-.18}}}}
    const floor=H-35;if(b.y+ballR>=floor){b.y=floor-ballR;if(Math.abs(b.vy)>.9){b.vy=-Math.abs(b.vy)*.28;b.vx*=.88}else{b.vy=0;b.vx*=.90}
      if(Math.abs(b.vx)<.16&&Math.abs(b.vy)<.16)b.settleFrames++;else b.settleFrames=0;if(b.settleFrames>16)settle(b)
    }else b.settleFrames=0
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#12183d");bg.addColorStop(1,"#070a18");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#ffe46d88";ctx.setLineDash([5,8]);ctx.beginPath();ctx.moveTo(dropX,20);ctx.lineTo(dropX,95);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle="#dce6ff66";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(pegWallMargin-8,topY-26);ctx.lineTo(pegWallMargin-8,slotTop+5);ctx.moveTo(W-pegWallMargin+8,topY-26);ctx.lineTo(W-pegWallMargin+8,slotTop+5);ctx.stroke();ctx.lineWidth=1;
  for(const p of pegs){ctx.beginPath();ctx.arc(p.x,p.y,pegR,0,Math.PI*2);ctx.fillStyle="#eaf0ff";ctx.shadowColor="#9eb8ff";ctx.shadowBlur=7;ctx.fill();ctx.shadowBlur=0}
  const prizes=state?.show?.prizes||[100,250,500,1000,2500,5000,2500,1000,500,250,100];
  for(let i=0;i<slots;i++){const x=i*slotW,pr=Number(prizes[i]||0);ctx.fillStyle=pr>=2500?"#ffd84a33":pr>=1000?"#74a7ff20":"#ffffff10";ctx.fillRect(x+3,slotTop+8,slotW-6,70);ctx.fillStyle=pr>=2500?"#ffe36b":"#fff";ctx.font="900 15px system-ui";ctx.textAlign="center";ctx.fillText(money(pr),x+slotW/2,slotTop+39)}
  for(let i=0;i<=slots;i++){const x=i*slotW;ctx.fillStyle="#ffffff55";ctx.fillRect(x-1.5,slotTop+4,3,H-slotTop-4);if(i>0&&i<slots){ctx.beginPath();ctx.arc(x,slotTop+2,6,0,Math.PI*2);ctx.fillStyle="#dce6ff";ctx.fill()}}
  for(const b of balls){ctx.beginPath();ctx.arc(b.x,b.y,ballR,0,Math.PI*2);ctx.fillStyle="#ffd84a";ctx.shadowColor="#ffd84a";ctx.shadowBlur=13;ctx.fill();ctx.shadowBlur=0}
}
function loop(){physics();draw();requestAnimationFrame(loop)}loop();
function pt(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
c.addEventListener("pointermove",e=>dropX=Math.max(dropMinX,Math.min(dropMaxX,pt(e).x)));
c.addEventListener("pointerdown",e=>{dropX=Math.max(dropMinX,Math.min(dropMaxX,pt(e).x));startDrop(dropX)});
$("dropBtn").onclick=()=>startDrop(dropX);

if(session.code&&session.token){openGame();refresh()}
setInterval(()=>{if(!document.hidden&&session.token)refresh()},2500);
</script>
</body></html>
